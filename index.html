<!doctype html>
<html ng-app="mailDevApp" ng-controller="MainCtrl">
<head>
    <meta charset="utf-8"/>
    <title>FsMail Workspace</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="icon.png" />
    <style>
        /* Modern Minimalist Overrides */
        body { background: #ffffff !important; font-family: 'Inter', sans-serif !important; }
        .sidebar { background: #f9fafb !important; border-right: 1px solid #e5e7eb !important; }
        .email-item-link { background: #ffffff !important; border-bottom: 1px solid #f3f4f6 !important; padding: 16px !important; }
        .email-item.unread .email-item-link { background: #eff6ff !important; border-left: 4px solid #2563eb !important; }
        .email-item.current .email-item-link { background: #f3f4f6 !important; }
        .brand { color: #111827 !important; font-weight: 700 !important; }
        .search-input { background: #f3f4f6 !important; border-radius: 8px !important; }
    </style>
</head>
<body ng-class="{'dark-theme': settings.darkThemeEnabled}">

    <div class="application-container">
        <div class="sidebar">
            <div class="sidebar-header" style="background: #ffffff; border-bottom: 1px solid #e5e7eb;">
                <div class="brand-container">
                    <a class="brand" href="#/" style="color: #111827; font-size: 1.2rem;">FsMail</a>
                </div>
            </div>

            <div class="sidebar-emails-container">
                <div class="search-container">
                    <input type="text" ng-model="search" class="search-input" placeholder="Search your messages...">
                </div>
                
                <div class="sidebar-scrollable-content">
                    <ul class="email-list">
                        <li ng-repeat="item in items | orderBy:'time':!reverse | filter: search" 
                            class="email-item" ng-class="{current: item.id === currentItemId, unread: !item.read}">
                            <a href="#/email/{{item.id}}" class="email-item-link">
                                <span class="title" style="color: #374151;">{{item.subject}}</span>
                                <span class="title-subline">{{item.from.0.address}}</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="main-container">
            <div class="email-container" ng-view></div>
        </div>
    </div>

    <script src="components/angular/angular.min.js"></script>
    <script src="components/angular-resource/angular-resource.min.js"></script>
    <script src="components/angular-route/angular-route.min.js"></script>
    <script src="components/angular-sanitize/angular-sanitize.min.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/controllers/main.js"></script>
    <script src="scripts/controllers/item.js"></script>
</body>
</html>
