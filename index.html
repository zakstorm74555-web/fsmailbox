<!doctype html>
<html ng-app="mailDevApp" ng-controller="MainCtrl">
    <head>
        <meta charset="utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title>FsMail Workspace{{ unreadItems > 0 ? ' (+' + unreadItems + ')' : '' }}</title>
        <meta name="description" content="Professional sovereign messaging interface optimization panel.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="icon" id="favicon" type="image/png" href="icon.png" />
    </head>
    <body ng-class="{'dark-theme': settings.darkThemeEnabled}" style="font-family: 'Plus Jakarta Sans', sans-serif;">

        <div class="application-container">

            <div class="sidebar">

                <div class="sidebar-header">
                    <div class="brand-container">
                        <a class="brand ng-cloak" href="#/">
                            <img src="icon.png" alt="FsMail" style="width: 18px; height: 18px; display: inline-block; vertical-align: middle; margin-right: 6px; object-contain: contain;">
                            <span class="brand-text" style="font-weight: 700; letter-spacing: -0.5px;">FsMail</span>
                        </a>
                        <span class="brand-unread ng-cloak" title="Total messages stream count" ng-if="items && items.length" ng-click="toggleHeaderCountsUnread()">
                            {{items.length}} {{ unreadItems > 0 ? ' (+' + unreadItems + ')' : '' }}
                        </span>
                    </div>

                    <div class="header-nav ng-cloak">
                        <ul class="header-nav-list">
                            <li class="header-nav-item">
                                <a ng-click="refreshList()" href="" class="header-nav-item-link" title="Refresh inbox">
                                    <i class="fas fa-sync"></i>
                                </a>
                            </li >
                            <li class="header-nav-item">
                                <a ng-click="markReadAll()" href="" class="header-nav-item-link" title="Mark all as read">
                                    <i class="fas fa-check-double"></i>
                                </a>
                            </li>
                            <li class="header-nav-item">
                                <a ng-click="deleteAll()" href="" class="header-nav-item-link" title="Clear folder content">
                                    <i ng-if="deleteAllSafeguard" class="fas fa-trash-alt"></i>
                                    <i ng-if="!deleteAllSafeguard" class="fas fa-trash-alt danger" style="color: #ef4444 !important;"></i>
                                </a>
                            </li>
                            <li class="header-nav-item">
                                <a ng-click="toggleDarkTheme()" href="" class="header-nav-item-link" title="Toggle theme layout">
                                    <i ng-if="settings.darkThemeEnabled" class="fas fa-sun"></i>
                                    <i ng-if="!settings.darkThemeEnabled" class="fas fa-moon"></i>
                                </a>
                            </li>
                            <li class="header-nav-item">
                                <a ng-click="toggleNavMore($event)" href="" class="header-nav-item-link" title="Settings">
                                    <i class="fas fa-cog"></i>
                                </a>
                            </li>
                        </ul>

                        <div class="header-nav-more" ng-click="headerNavStopPropagation($event)">
                            <ul class="dropdown-menu header-nav-more-menu" ng-class="{ open: navMoreOpen }">
                                <li>
                                    <label class="header-nav-switch" ng-class="{ disabled: !notificationsSupported }" for="toggle-notifications" title="Browser notifications">
                                        <input type="checkbox" name="notifications" id="toggle-notifications" ng-disabled="!notificationsSupported" ng-checked="settings.notificationsEnabled" ng-click="toggleNotifications()"/>
                                        Desktop notifications
                                    </label>
                                </li>
                                <li>
                                    <label class="header-nav-switch" for="toggle-auto-show">
                                        <input type="checkbox" name="auto-show" id="toggle-auto-show" ng-checked="settings.autoShowEnabled" ng-click="toggleAutoShow()"/>
                                        Auto-open new messages
                                    </label>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="sidebar-emails-container">
                    <div class="search-container ng-cloak">
                        <input type="text" ng-model="search" class="search-input" placeholder="Search mail...">
                        <i class="fas fa-search search-icon"></i>
                    </div>
                    <div class="sidebar-scrollable-content ng-cloak">

                        <div ng-if="itemsLoading" class="emails-loading">
                            Syncing repository...
                        </div>

                        <div ng-if="!itemsLoading && items && !items.length" class="emails-empty" style="font-style: italic; font-size: 13px; text-align: center; padding-top: 2rem;">
                            No messages inside this workspace.
                        </div>

                        <ul class="email-list">
                            <li ng-repeat="item in items | orderBy:'time':!reverse | filter: search" class="email-item email-{{item.id}}" ng-class="{current: item.id === currentItemId, read: item.read, unread: !item.read}">
                                <a href="#/email/{{item.id}}" class="email-item-link">
                                    <span class="title">
                                        {{item.subject}}<span ng-hide="!item.attachments">&nbsp;<i class="fas fa-paperclip" style="font-size: 11px; opacity: 0.6;"></i></span>
                                        <span class="title-subline" title="{{item.to}}">
                                            From:&nbsp;{{item.from.0.name || item.from.0.address || 'External User'}}
                                        </span>
                                    </span>
                                    <span class="subline">
                                        Received: {{item.time | date:'hh:mm a | dd MMM yyyy'}}
                                    </span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>

            <div class="main-container ng-cloak">
                <div class="email-container" ng-view></div>
            </div>

        </div>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        
        <script src="components/angular/angular.min.js"></script>
        <script src="components/angular-resource/angular-resource.min.js"></script>
        <script src="components/angular-route/angular-route.min.js"></script>
        <script src="components/angular-sanitize/angular-sanitize.min.js"></script>
        <script src="components/angular-cookies/angular-cookies.min.js"></script>
        <script src="components/socket.io/socket.io.min.js"></script>

        <script src="scripts/app.js"></script>
        <script src="scripts/services.js"></script>
        <script src="scripts/components/address.js"></script>
        <script src="scripts/controllers/main.js"></script>
        <script src="scripts/controllers/item.js"></script>

    </body>
</html>
